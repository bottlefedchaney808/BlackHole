<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>chart-app</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0e1117;
      color: #F4F7FF;
      font: 13px/1.4 system-ui, sans-serif;
    }
    #meta {
      height: 40px;
      box-sizing: border-box;
      padding: 6px 12px;
      color: #A9B7D0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #meta strong { color: #F4F7FF; letter-spacing: 0.04em; }
    #meta input, #meta select, #meta button {
      background: #1b2433;
      color: #F4F7FF;
      border: 1px solid #334155;
      border-radius: 4px;
      height: 26px;
      font: 12px/1 system-ui, sans-serif;
    }
    #ticker { width: 72px; text-transform: uppercase; padding: 0 8px; }
    #interval { padding: 0 6px; }
    #apply { padding: 0 10px; cursor: pointer; }
    #apply:disabled { opacity: 0.5; cursor: wait; }
    #stamp { margin-left: 8px; }
    #legs { display: flex; gap: 4px; margin-left: auto; }
    #legs span {
      font: 10px/24px ui-monospace, Consolas, monospace;
      letter-spacing: 0.04em;
      padding: 0 6px;
      border-radius: 4px;
      border: 1px solid #334155;
      color: #64748B;
      background: #111827;
    }
    #legs span.on { color: #0e1117; background: #34d399; border-color: #34d399; }
    #legs span.off { opacity: 0.55; }
    #legs span.pending { color: #94a3b8; }
    #overlays {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 26px;
      padding: 0 12px;
      color: #A9B7D0;
      font: 11px/1 system-ui, sans-serif;
    }
    #overlays label {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      user-select: none;
    }
    #overlays input { accent-color: #38BDF8; margin: 0; }
    /* Direction leg with too few bars to compute -- distinct from
       a leg that computed and did not fire. */
    #legs [data-leg].na { opacity: .35; text-decoration: line-through; }
    #chart { position: absolute; top: 66px; left: 0; right: 0; bottom: 0; }
  </style>
  <script src="/static/vendor/echarts.min.js"></script>
</head>
<body>
  <div id="meta">
    <input id="ticker" type="text" maxlength="8" value="SPY" spellcheck="false" />
    <select id="interval">
      <option>3m</option>
      <option>5m</option>
      <option>10m</option>
      <option selected>15m</option>
      <option>30m</option>
      <option>1h</option>
      <option>4h</option>
      <option>1d</option>
    </select>
    <button id="apply" type="button">Load</button>
    <strong id="label">—</strong>
    <span id="stamp"></span>
    <div id="legs">
      <span data-leg="wave3" title="Elliott wave 3">W3</span>
      <span data-leg="squeeze" title="Bollinger squeeze">SQ</span>
      <span data-leg="trend" title="ADX + MA trend">TR</span>
      <span data-leg="whale" title="Whale flow (sampled later)">WH</span>
      <span data-leg="liquidity" title="Dealer liquidity (sampled later)">LQ</span>
    </div>
  </div>
  <div id="overlays">
    <label><input type="checkbox" data-overlay="ema20" checked>ema20</label>
    <label><input type="checkbox" data-overlay="ema50" checked>ema50</label>
    <label><input type="checkbox" data-overlay="vwap" checked>vwap</label>
    <label><input type="checkbox" data-overlay="bb" checked>bb</label>
    <label><input type="checkbox" data-overlay="whale" checked>whale</label>
    <label><input type="checkbox" data-overlay="volume" checked>volume</label>
    <label><input type="checkbox" data-overlay="flow" checked>flow</label>
    <label><input type="checkbox" data-overlay="ema200">ema200</label>
    <label><input type="checkbox" data-overlay="vwapb">vwap&#177;&#963;</label>
    <label><input type="checkbox" data-overlay="atr">atr ch</label>
    <label><input type="checkbox" data-overlay="pdhl">pd h/l</label>
    <label><input type="checkbox" data-overlay="rsi">rsi</label>
    <label><input type="checkbox" data-overlay="cci">cci</label>
    <label><input type="checkbox" data-overlay="macd">macd</label>
  </div>
  <div id="chart"></div>
  <script>
    // Kept in sync by hand with shared/chart_theme.py (no purple/violet).
    const UP = "#38BDF8";
    const DOWN = "#F87171";
    const TEXT = "#F4F7FF";
    const MUTED = "#A9B7D0";
    const GRID = "#64748B";
    const MARK = {
      buy:  { color: "lime",    symbol: "triangle", rotate: 0 },
      add:  { color: "gold",    symbol: "diamond",  rotate: 0 },
      hold: { color: "gray",    symbol: "circle",   rotate: 0 },
      sell: { color: "crimson", symbol: "triangle", rotate: 180 },
    };

    const chart = echarts.init(document.getElementById("chart"), null, { renderer: "canvas" });

    function line(name, data, color, width, dash, xIdx, yIdx) {
      return {
        name: name,
        type: "line",
        xAxisIndex: xIdx != null ? xIdx : 0,
        yAxisIndex: yIdx != null ? yIdx : 0,
        data: data,
        showSymbol: false,
        connectNulls: false,
        lineStyle: { color: color, width: width || 1, type: dash || "solid" },
        itemStyle: { color: color },
      };
    }

    function whaleMarks(bars, signals) {
      const data = [];
      for (let i = 0; i < bars.length; i++) {
        if (!signals[i] || !signals[i].whale) continue;
        data.push({
          value: [bars[i].ts, bars[i].high],
          symbol: "circle",
          symbolSize: 8,
          itemStyle: { color: "#f59e0b" },
        });
      }
      return {
        name: "whale",
        type: "scatter",
        xAxisIndex: 0,
        yAxisIndex: 0,
        data: data,
        tooltip: { formatter: "whale" },
      };
    }

    function markerSeries(bars, markers) {
      const data = [];
      for (let i = 0; i < markers.length; i++) {
        const kind = markers[i];
        if (!MARK[kind] || !bars[i]) continue;
        const spec = MARK[kind];
        data.push({
          name: kind,
          value: [bars[i].ts, bars[i].low],
          symbol: spec.symbol,
          symbolRotate: spec.rotate,
          symbolSize: kind === "hold" ? 8 : 12,
          itemStyle: { color: spec.color },
        });
      }
      return {
        name: "markers",
        type: "scatter",
        xAxisIndex: 0,
        yAxisIndex: 0,
        data: data,
        tooltip: { formatter: (p) => p.name },
      };
    }

    // ---- overlay toggles (A1) --------------------------------------------
    // Which optional series render. OHLC and the buy/add/hold/sell markers are
    // always on -- they are the chart, not an overlay.
    const OVERLAY_KEYS = [
      "ema20", "ema50", "vwap", "bb", "whale", "volume", "flow",
      // Added indicators. Default off: `enabledOverlays()` reads the live
      // checkbox state, and a saved overlay-store from before these existed
      // simply has no entry for them, so they stay unchecked until asked for.
      "ema200", "vwapb", "atr", "pdhl",
      // Oscillators. Each gets its OWN pane rather than sharing the
      // price axis -- RSI is 0-100, CCI swings in the hundreds and MACD
      // is in price-difference units, so none of them can share a scale
      // with candles (or with each other).
      "rsi", "cci", "macd",
    ];
    const OVERLAY_STORE = "chart-app-overlays";
    // Series name -> overlay key, so the ECharts legend mirrors the checkboxes.
    const SERIES_OVERLAY = {
      ema20: "ema20", ema50: "ema50", vwap: "vwap",
      bb_upper: "bb", bb_mid: "bb", bb_lower: "bb",
      whale: "whale", volume: "volume",
      call: "flow", put: "flow", net: "flow",
      ema200: "ema200",
      vwap_up: "vwapb", vwap_dn: "vwapb",
      atr_up: "atr", atr_dn: "atr",
      pdh: "pdhl", pdl: "pdhl",
      rsi: "rsi", cci: "cci",
      macd: "macd", macd_signal: "macd", macd_hist: "macd",
    };

    function enabledOverlays() {
      const out = {};
      OVERLAY_KEYS.forEach((k) => { out[k] = true; });
      document.querySelectorAll("#overlays [data-overlay]").forEach((el) => {
        out[el.dataset.overlay] = !!el.checked;
      });
      return out;
    }

    function legendSelected(ov) {
      const sel = {};
      Object.keys(SERIES_OVERLAY).forEach((name) => {
        sel[name] = !!ov[SERIES_OVERLAY[name]];
      });
      return sel;
    }

    function saveOverlays() {
      try {
        localStorage.setItem(OVERLAY_STORE, JSON.stringify(enabledOverlays()));
      } catch (_err) {
        /* private mode / quota -- toggles still work for this session */
      }
    }

    function restoreOverlays() {
      let saved = null;
      try {
        saved = JSON.parse(localStorage.getItem(OVERLAY_STORE) || "null");
      } catch (_err) {
        saved = null;
      }
      if (!saved || typeof saved !== "object") return;
      document.querySelectorAll("#overlays [data-overlay]").forEach((el) => {
        if (typeof saved[el.dataset.overlay] === "boolean") el.checked = saved[el.dataset.overlay];
      });
    }

    function render(state) {
      const ticker = state.ticker || "";
      const interval = state.interval || "";
      document.getElementById("label").textContent = ticker + "  " + interval;
      // Tell an embedding page what is on screen. The dashboard's Chart tab
      // hosts this app in a cross-origin iframe (:8791 inside :8787), so
      // postMessage is the only channel; it uses this to filter the position
      // panel beside the chart down to the symbol being charted.
      if (window.parent && window.parent !== window) {
        try {
          window.parent.postMessage(
            { type: "chart-symbol", ticker: ticker, interval: interval },
            "*"
          );
        } catch (_err) { /* embedder gone; nothing to tell */ }
      }
      const live = state.live || {};
      const bits = [];
      if (state.as_of) bits.push(state.as_of);
      if (live.score != null) bits.push("score " + live.score);
      if (live.conviction) bits.push(live.conviction);
      document.getElementById("stamp").textContent = bits.join("  ·  ");
      const sig = live.signals || {};
      // "Not enough bars at this timeframe" and "computed, nothing fired"
      // both render as every leg dark, so say which it is.
      const dir = state.direction || { active: true };
      document.querySelectorAll("#legs [data-leg]").forEach((el) => {
        const on = dir.active && !!sig[el.dataset.leg];
        el.classList.toggle("on", on);
        el.classList.toggle("off", !on);
        el.classList.toggle("na", !dir.active);
        el.title = dir.active
          ? el.dataset.leg
          : "needs " + dir.min_bars + " bars, have " + dir.bars +
            " at this timeframe";
      });
      if (!dir.active) {
        const stampEl = document.getElementById("stamp");
        stampEl.textContent += (stampEl.textContent ? "  ·  " : "") +
          "direction inactive (" + dir.bars + "/" + dir.min_bars + " bars)";
      }

      const bars = state.bars || [];
      const overlays = state.overlays || {};
      const osc = state.oscillators || {};
      const markers = state.markers || [];
      const cats = bars.map((b) => b.ts);
      const ohlc = bars.map((b) => [b.open, b.close, b.low, b.high]);
      const volumes = bars.map((b) => ({
        value: b.volume,
        itemStyle: { color: b.close >= b.open ? UP : DOWN },
      }));

      const ov = enabledOverlays();
      const hasFlow = !!state.flow && ov.flow;
      const flowCall = hasFlow ? (state.flow.call || []) : [];
      const flowPut = hasFlow ? (state.flow.put || []) : [];
      const flowNet = hasFlow ? (state.flow.net || []) : [];

      const key = ticker + "|" + interval + "|" + bars.length;
      const resetZoom = key !== lastKey;
      lastKey = key;
      // Dropping a series only takes effect under notMerge, so an overlay
      // toggle has to force a full setOption too -- but keep the user's zoom.
      const overlayKey = JSON.stringify(ov);
      const overlaysChanged = overlayKey !== lastOverlayKey;
      lastOverlayKey = overlayKey;
      const show = Math.min(bars.length, VISIBLE[interval] || bars.length || 1);
      const startPct = bars.length ? 100 * (bars.length - show) / bars.length : 0;

      // ---- pane layout -------------------------------------------------
      // Panes are computed, not branched. This used to be a pair of
      // `hasFlow ? [...3 panes] : [...2 panes]` ternaries repeated three
      // times (grid, xAxis, yAxis); adding an oscillator pane to that shape
      // would have meant eight hand-written combinations. Now each optional
      // pane declares itself and the geometry falls out.
      const panes = [{ key: "price", weight: 60 }];
      if (ov.volume) panes.push({ key: "volume", weight: 10, splitLine: false });
      if (hasFlow) panes.push({ key: "flow", weight: 16 });
      if (ov.rsi) panes.push({ key: "rsi", weight: 14, min: 0, max: 100 });
      if (ov.cci) panes.push({ key: "cci", weight: 14 });
      if (ov.macd) panes.push({ key: "macd", weight: 14 });

      const GAP = 3;                       // % of chart height between panes
      const TOP = 1.2;                     // room for the legend
      const totalWeight = panes.reduce((a, p) => a + p.weight, 0);
      const usable = 100 - TOP - 4 - GAP * (panes.length - 1);
      const PANE = { grid: [], xAxis: [], yAxis: [], index: {}, all: [] };
      let cursor = TOP;
      panes.forEach((pane, i) => {
        const height = usable * (pane.weight / totalWeight);
        PANE.index[pane.key] = i;
        PANE.all.push(i);
        PANE.grid.push({
          left: 56, right: 16,
          top: cursor.toFixed(2) + "%",
          height: height.toFixed(2) + "%",
        });
        PANE.xAxis.push({
          type: "category", data: cats, gridIndex: i,
          // Only the bottom pane carries date labels; the rest would just
          // repeat them and eat vertical space.
          axisLabel: { color: MUTED, show: i === panes.length - 1 },
          axisLine: { lineStyle: { color: GRID } },
          splitLine: { show: false },
        });
        PANE.yAxis.push({
          scale: pane.min === undefined,
          min: pane.min, max: pane.max,
          gridIndex: i,
          axisLabel: { color: MUTED },
          splitLine: pane.splitLine === false
            ? { show: false }
            : { lineStyle: { color: "#1b2433" } },
        });
        cursor += height + GAP;
      });
      const paneOf = (key) => PANE.index[key];
      const oscSeries = (name, key, data, color, type) => ({
        name: name,
        type: type || "line",
        xAxisIndex: paneOf(key),
        yAxisIndex: paneOf(key),
        data: data || [],
        showSymbol: false,
        lineStyle: { width: 1.3, color: color },
        itemStyle: { color: color },
        connectNulls: false,
      });

      const opt = {
        backgroundColor: "#0e1117",
        animation: false,
        legend: {
          top: 0,
          right: 8,
          itemWidth: 10,
          itemHeight: 6,
          textStyle: { color: MUTED, fontSize: 10 },
          inactiveColor: "#334155",
          selected: legendSelected(ov),
          data: (hasFlow
            ? ["ema20", "ema50", "vwap", "bb_upper", "bb_mid", "bb_lower", "whale", "call", "put", "net"]
            : ["ema20", "ema50", "vwap", "bb_upper", "bb_mid", "bb_lower", "whale"]
          ).concat([
            "ema200", "vwap_up", "vwap_dn", "atr_up", "atr_dn", "pdh", "pdl",
            "rsi", "cci", "macd", "macd_signal", "macd_hist",
          ]),
        },
        tooltip: { trigger: "axis", axisPointer: { type: "cross" } },
        axisPointer: { link: [{ xAxisIndex: PANE.all }] },
        grid: PANE.grid,
        xAxis: PANE.xAxis,
        yAxis: PANE.yAxis,
        series: [
          {
            name: "ohlc",
            type: "candlestick",
            xAxisIndex: 0,
            yAxisIndex: 0,
            data: ohlc,
            itemStyle: {
              color: UP,
              color0: DOWN,
              borderColor: UP,
              borderColor0: DOWN,
            },
          },
          ...(ov.ema20 ? [line("ema20", overlays.ema20 || [], "#fbbf24", 1.4)] : []),
          ...(ov.ema50 ? [line("ema50", overlays.ema50 || [], "#60a5fa", 1.4)] : []),
          ...(ov.vwap ? [line("vwap", overlays.vwap || [], "#34d399", 1.2, "dashed")] : []),
          ...(ov.bb ? [
            line("bb_upper", overlays.bb_upper || [], "#64748B", 1),
            line("bb_mid", overlays.bb_mid || [], "#94a3b8", 1, "dotted"),
            line("bb_lower", overlays.bb_lower || [], "#64748B", 1),
          ] : []),
          ...(ov.ema200 ? [line("ema200", overlays.ema200 || [], "#a78bfa", 1.6)] : []),
          ...(ov.vwapb ? [
            line("vwap_up", overlays.vwap_up || [], "#34d399", 1, "dotted"),
            line("vwap_dn", overlays.vwap_dn || [], "#34d399", 1, "dotted"),
          ] : []),
          ...(ov.atr ? [
            line("atr_up", overlays.atr_up || [], "#f472b6", 1, "dashed"),
            line("atr_dn", overlays.atr_dn || [], "#f472b6", 1, "dashed"),
          ] : []),
          ...(ov.pdhl ? [
            line("pdh", overlays.pdh || [], "#fbbf24", 1, "dashed"),
            line("pdl", overlays.pdl || [], "#fbbf24", 1, "dashed"),
          ] : []),
          ...(ov.whale ? [whaleMarks(bars, state.signals || [])] : []),
          markerSeries(bars, markers),
          ...(ov.volume ? [{
            name: "volume",
            type: "bar",
            xAxisIndex: paneOf("volume"),
            yAxisIndex: paneOf("volume"),
            data: volumes,
          }] : []),
          ...(hasFlow ? [
            line("call", flowCall, "#34d399", 1.2, null, paneOf("flow"), paneOf("flow")),
            line("put", flowPut, "#f87171", 1.2, null, paneOf("flow"), paneOf("flow")),
            line("net", flowNet, "#F4F7FF", 1.1, null, paneOf("flow"), paneOf("flow")),
          ] : []),
          // Oscillator panes. `osc` is whatever the server computed; a
          // missing key renders as an empty series rather than throwing.
          ...(ov.rsi ? [
            oscSeries("rsi", "rsi", osc.rsi, "#38bdf8"),
          ] : []),
          ...(ov.cci ? [
            oscSeries("cci", "cci", osc.cci, "#f59e0b"),
          ] : []),
          ...(ov.macd ? [
            oscSeries("macd", "macd", osc.macd, "#60a5fa"),
            oscSeries("macd_signal", "macd", osc.macd_signal, "#f472b6"),
            oscSeries("macd_hist", "macd", osc.macd_hist, "#64748b", "bar"),
          ] : []),
        ],
        textStyle: { color: TEXT },
      };
      const rebuild = resetZoom || overlaysChanged;
      if (rebuild) {
        // notMerge drops dataZoom unless we re-supply it. On a pure overlay
        // toggle, carry the user's current window over instead of snapping back.
        let zoomStart = startPct;
        let zoomEnd = 100;
        if (!resetZoom) {
          const cur = (chart.getOption() || {}).dataZoom;
          if (cur && cur.length) {
            if (cur[0].start != null) zoomStart = cur[0].start;
            if (cur[0].end != null) zoomEnd = cur[0].end;
          }
        }
        opt.dataZoom = [
          {
            type: "inside",
            xAxisIndex: PANE.all,
            filterMode: "none",
            zoomOnMouseWheel: true,
            moveOnMouseMove: true,
            moveOnMouseWheel: false,
          },
          {
            type: "slider",
            xAxisIndex: PANE.all,
            height: 22,
            bottom: 6,
            start: zoomStart,
            end: zoomEnd,
            borderColor: "#334155",
            fillerColor: "rgba(56,189,248,0.15)",
            handleStyle: { color: "#38BDF8" },
            textStyle: { color: MUTED },
            dataBackground: { lineStyle: { color: "#64748B" }, areaStyle: { color: "#1b2433" } },
          },
        ];
      }
      chart.setOption(opt, rebuild);
      // The canvas may still have been zero-size when init() measured it
      // (iframe not laid out yet) -- resizing after every paint is cheap.
      chart.resize();
    }

    let lastKey = "";
    let lastOverlayKey = "";
    let lastState = null;
    const VISIBLE = {
      "3m": 80, "5m": 80, "10m": 80, "15m": 80,
      "30m": 80, "1h": 80, "4h": 80, "1d": 180,
    };
    // Mirrors _LOOKBACK in chart_app/server.py. Intraday lookback is capped
    // at 30 days by the shared validator, so 1h/4h ask for 30d, not the
    // 60d/1y they used to (both were rejected before any fetch, which is why
    // those two timeframes never loaded).
    const LOOKBACK = {
      "3m": "5d", "5m": "5d", "10m": "10d", "15m": "5d",
      "30m": "20d", "1h": "30d", "4h": "30d", "1d": "1y",
    };

    async function poll() {
      try {
        const res = await fetch("/api/state");
        if (!res.ok) return;
        const state = await res.json();
        lastState = state;
        render(state);
        if (state.ticker) document.getElementById("ticker").value = state.ticker;
        if (state.interval) document.getElementById("interval").value = state.interval;
      } catch (_err) {
        /* keep last frame */
      }
    }

    async function loadSymbol() {
      const btn = document.getElementById("apply");
      const ticker = document.getElementById("ticker").value.trim().toUpperCase();
      const interval = document.getElementById("interval").value;
      if (!ticker) return;
      btn.disabled = true;
      try {
        const sw = await fetch("/api/symbol", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ticker: ticker, interval: interval }),
        });
        if (!sw.ok) {
          document.getElementById("stamp").textContent = "bad ticker/interval";
          return;
        }
        const lookback = LOOKBACK[interval] || "5d";
        const refreshRes = await fetch("/api/refresh", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ lookback: lookback }),
        });
        let refreshBody = null;
        try { refreshBody = await refreshRes.json(); } catch (_e) { /* non-JSON */ }
        await poll();
        // Say why a load produced nothing. A coarse interval is aggregated
        // from a lot of one-minute rows and the provider can time out; that
        // used to leave an empty chart with no explanation at all.
        if (refreshBody && refreshBody.ok === false) {
          const stampEl = document.getElementById("stamp");
          stampEl.textContent =
            "load failed for " + (refreshBody.interval || "") + " — " +
            (refreshBody.error || "unknown error") + " — press Load to retry";
        }
      } finally {
        btn.disabled = false;
        // A symbol/interval switch repaints with notMerge; if the canvas was
        // measured at zero (fresh iframe) that paints blank until something
        // else triggers a resize. Do it here instead of waiting.
        chart.resize();
      }
    }

    document.getElementById("apply").addEventListener("click", loadSymbol);
    document.getElementById("ticker").addEventListener("keydown", (e) => {
      if (e.key === "Enter") loadSymbol();
    });
    document.getElementById("interval").addEventListener("change", loadSymbol);

    restoreOverlays();
    document.querySelectorAll("#overlays [data-overlay]").forEach((el) => {
      el.addEventListener("change", () => {
        saveOverlays();
        // Repaint from the frame we already have -- a toggle is a view
        // change, not a data fetch.
        if (lastState) render(lastState);
        else poll();
      });
    });

    // Embedded use (dashboard Chart tab / Overview hero): ?ticker=SPY&interval=15m
    // pins the frame to a symbol on boot instead of inheriting server state.
    const qs = new URLSearchParams(window.location.search);
    const qsTicker = (qs.get("ticker") || "").trim().toUpperCase();
    const qsInterval = (qs.get("interval") || "").trim();
    if (qsTicker || qsInterval) {
      if (qsTicker) document.getElementById("ticker").value = qsTicker;
      if (qsInterval) {
        const sel = document.getElementById("interval");
        if (Array.prototype.some.call(sel.options, (o) => o.value === qsInterval)) {
          sel.value = qsInterval;
        }
      }
      loadSymbol();
    } else {
      poll();
    }
    setInterval(poll, 5000);

    window.addEventListener("resize", () => chart.resize());
    // The iframe's own box can change without a window resize (parent grid
    // relayout, sidebar add/remove) -- ResizeObserver is the only thing that
    // catches that.
    if (typeof ResizeObserver !== "undefined") {
      const ro = new ResizeObserver(() => chart.resize());
      ro.observe(document.getElementById("chart"));
    }
    // Parent-page nudge (dashboard chart.html posts this on iframe load and
    // when the tab becomes visible again).
    window.addEventListener("message", (e) => {
      if (e.data && e.data.type === "chart-resize") chart.resize();
    });
  </script>
</body>
</html>
