<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>chart-app</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0e1117;
      color: #F4F7FF;
      font: 13px/1.4 system-ui, sans-serif;
    }
    #meta {
      height: 40px;
      box-sizing: border-box;
      padding: 6px 12px;
      color: #A9B7D0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #meta strong { color: #F4F7FF; letter-spacing: 0.04em; }
    #meta input, #meta select, #meta button {
      background: #1b2433;
      color: #F4F7FF;
      border: 1px solid #334155;
      border-radius: 4px;
      height: 26px;
      font: 12px/1 system-ui, sans-serif;
    }
    #ticker { width: 72px; text-transform: uppercase; padding: 0 8px; }
    #interval { padding: 0 6px; }
    #apply { padding: 0 10px; cursor: pointer; }
    #apply:disabled { opacity: 0.5; cursor: wait; }
    #stamp { margin-left: 8px; }
    #legs { display: flex; gap: 4px; margin-left: auto; }
    #legs span {
      font: 10px/24px ui-monospace, Consolas, monospace;
      letter-spacing: 0.04em;
      padding: 0 6px;
      border-radius: 4px;
      border: 1px solid #334155;
      color: #64748B;
      background: #111827;
    }
    #legs span.on { color: #0e1117; background: #34d399; border-color: #34d399; }
    #legs span.off { opacity: 0.55; }
    #legs span.pending { color: #94a3b8; }
    #chart { position: absolute; top: 40px; left: 0; right: 0; bottom: 0; }
  </style>
  <script src="/static/vendor/echarts.min.js"></script>
</head>
<body>
  <div id="meta">
    <input id="ticker" type="text" maxlength="8" value="SPY" spellcheck="false" />
    <select id="interval">
      <option>3m</option>
      <option>5m</option>
      <option>10m</option>
      <option selected>15m</option>
      <option>30m</option>
      <option>1h</option>
      <option>4h</option>
      <option>1d</option>
    </select>
    <button id="apply" type="button">Load</button>
    <strong id="label">—</strong>
    <span id="stamp"></span>
    <div id="legs">
      <span data-leg="wave3" title="Elliott wave 3">W3</span>
      <span data-leg="squeeze" title="Bollinger squeeze">SQ</span>
      <span data-leg="trend" title="ADX + MA trend">TR</span>
      <span data-leg="whale" title="Whale flow (sampled later)">WH</span>
      <span data-leg="liquidity" title="Dealer liquidity (sampled later)">LQ</span>
    </div>
  </div>
  <div id="chart"></div>
  <script>
    const UP = "#38BDF8";
    const DOWN = "#C084FC";
    const TEXT = "#F4F7FF";
    const MUTED = "#A9B7D0";
    const GRID = "#64748B";
    const MARK = {
      buy:  { color: "lime",   symbol: "triangle", rotate: 0 },
      add:  { color: "gold",   symbol: "diamond",  rotate: 0 },
      hold: { color: "gray",   symbol: "circle",   rotate: 0 },
      sell: { color: "orchid", symbol: "triangle", rotate: 180 },
    };

    const chart = echarts.init(document.getElementById("chart"), null, { renderer: "canvas" });

    function line(name, data, color, width, dash) {
      return {
        name: name,
        type: "line",
        xAxisIndex: 0,
        yAxisIndex: 0,
        data: data,
        showSymbol: false,
        connectNulls: false,
        lineStyle: { color: color, width: width || 1, type: dash || "solid" },
        itemStyle: { color: color },
      };
    }

    function whaleMarks(bars, signals) {
      const data = [];
      for (let i = 0; i < bars.length; i++) {
        if (!signals[i] || !signals[i].whale) continue;
        data.push({
          value: [bars[i].ts, bars[i].high],
          symbol: "circle",
          symbolSize: 8,
          itemStyle: { color: "#f59e0b" },
        });
      }
      return {
        name: "whale",
        type: "scatter",
        xAxisIndex: 0,
        yAxisIndex: 0,
        data: data,
        tooltip: { formatter: "whale" },
      };
    }

    function markerSeries(bars, markers) {
      const data = [];
      for (let i = 0; i < markers.length; i++) {
        const kind = markers[i];
        if (!MARK[kind] || !bars[i]) continue;
        const spec = MARK[kind];
        data.push({
          name: kind,
          value: [bars[i].ts, bars[i].low],
          symbol: spec.symbol,
          symbolRotate: spec.rotate,
          symbolSize: kind === "hold" ? 8 : 12,
          itemStyle: { color: spec.color },
        });
      }
      return {
        name: "markers",
        type: "scatter",
        xAxisIndex: 0,
        yAxisIndex: 0,
        data: data,
        tooltip: { formatter: (p) => p.name },
      };
    }

    function render(state) {
      const ticker = state.ticker || "";
      const interval = state.interval || "";
      document.getElementById("label").textContent = ticker + "  " + interval;
      const live = state.live || {};
      const bits = [];
      if (state.as_of) bits.push(state.as_of);
      if (live.score != null) bits.push("score " + live.score);
      if (live.conviction) bits.push(live.conviction);
      document.getElementById("stamp").textContent = bits.join("  ·  ");
      const sig = live.signals || {};
      document.querySelectorAll("#legs [data-leg]").forEach((el) => {
        const on = !!sig[el.dataset.leg];
        el.classList.toggle("on", on);
        el.classList.toggle("off", !on);
      });

      const bars = state.bars || [];
      const overlays = state.overlays || {};
      const markers = state.markers || [];
      const cats = bars.map((b) => b.ts);
      const ohlc = bars.map((b) => [b.open, b.close, b.low, b.high]);
      const volumes = bars.map((b) => ({
        value: b.volume,
        itemStyle: { color: b.close >= b.open ? UP : DOWN },
      }));

      const key = ticker + "|" + interval + "|" + bars.length;
      const resetZoom = key !== lastKey;
      lastKey = key;
      const show = Math.min(bars.length, VISIBLE[interval] || bars.length || 1);
      const startPct = bars.length ? 100 * (bars.length - show) / bars.length : 0;

      const opt = {
        backgroundColor: "#0e1117",
        animation: false,
        legend: {
          top: 0,
          right: 8,
          itemWidth: 10,
          itemHeight: 6,
          textStyle: { color: MUTED, fontSize: 10 },
          inactiveColor: "#334155",
          data: ["ema20", "ema50", "vwap", "bb_upper", "bb_mid", "bb_lower", "whale"],
        },
        tooltip: { trigger: "axis", axisPointer: { type: "cross" } },
        axisPointer: { link: [{ xAxisIndex: [0, 1] }] },
        grid: [
          { left: 56, right: 16, top: 8, height: "62%" },
          { left: 56, right: 16, top: "72%", height: "12%" },
        ],
        xAxis: [
          { type: "category", data: cats, gridIndex: 0, axisLabel: { color: MUTED }, axisLine: { lineStyle: { color: GRID } }, splitLine: { show: false } },
          { type: "category", data: cats, gridIndex: 1, axisLabel: { color: MUTED }, axisLine: { lineStyle: { color: GRID } }, splitLine: { show: false } },
        ],
        yAxis: [
          { scale: true, gridIndex: 0, axisLabel: { color: MUTED }, splitLine: { lineStyle: { color: "#1b2433" } } },
          { scale: true, gridIndex: 1, axisLabel: { color: MUTED }, splitLine: { show: false } },
        ],
        series: [
          {
            name: "ohlc",
            type: "candlestick",
            xAxisIndex: 0,
            yAxisIndex: 0,
            data: ohlc,
            itemStyle: {
              color: UP,
              color0: DOWN,
              borderColor: UP,
              borderColor0: DOWN,
            },
          },
          line("ema20", overlays.ema20 || [], "#fbbf24", 1.4),
          line("ema50", overlays.ema50 || [], "#60a5fa", 1.4),
          line("vwap", overlays.vwap || [], "#34d399", 1.2, "dashed"),
          line("bb_upper", overlays.bb_upper || [], "#64748B", 1),
          line("bb_mid", overlays.bb_mid || [], "#94a3b8", 1, "dotted"),
          line("bb_lower", overlays.bb_lower || [], "#64748B", 1),
          whaleMarks(bars, state.signals || []),
          markerSeries(bars, markers),
          {
            name: "volume",
            type: "bar",
            xAxisIndex: 1,
            yAxisIndex: 1,
            data: volumes,
          },
        ],
        textStyle: { color: TEXT },
      };
      if (resetZoom) {
        opt.dataZoom = [
          {
            type: "inside",
            xAxisIndex: [0, 1],
            filterMode: "none",
            zoomOnMouseWheel: true,
            moveOnMouseMove: true,
            moveOnMouseWheel: false,
          },
          {
            type: "slider",
            xAxisIndex: [0, 1],
            height: 22,
            bottom: 6,
            start: startPct,
            end: 100,
            borderColor: "#334155",
            fillerColor: "rgba(56,189,248,0.15)",
            handleStyle: { color: "#38BDF8" },
            textStyle: { color: MUTED },
            dataBackground: { lineStyle: { color: "#64748B" }, areaStyle: { color: "#1b2433" } },
          },
        ];
      }
      chart.setOption(opt, resetZoom);
    }

    let lastKey = "";
    const VISIBLE = {
      "3m": 80, "5m": 80, "10m": 80, "15m": 80,
      "30m": 80, "1h": 80, "4h": 80, "1d": 180,
    };
    const LOOKBACK = {
      "3m": "5d", "5m": "5d", "10m": "10d", "15m": "5d",
      "30m": "20d", "1h": "60d", "4h": "1y", "1d": "1y",
    };

    async function poll() {
      try {
        const res = await fetch("/api/state");
        if (!res.ok) return;
        const state = await res.json();
        render(state);
        if (state.ticker) document.getElementById("ticker").value = state.ticker;
        if (state.interval) document.getElementById("interval").value = state.interval;
      } catch (_err) {
        /* keep last frame */
      }
    }

    async function loadSymbol() {
      const btn = document.getElementById("apply");
      const ticker = document.getElementById("ticker").value.trim().toUpperCase();
      const interval = document.getElementById("interval").value;
      if (!ticker) return;
      btn.disabled = true;
      try {
        const sw = await fetch("/api/symbol", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ticker: ticker, interval: interval }),
        });
        if (!sw.ok) {
          document.getElementById("stamp").textContent = "bad ticker/interval";
          return;
        }
        const lookback = LOOKBACK[interval] || "5d";
        await fetch("/api/refresh", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ lookback: lookback }),
        });
        await poll();
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById("apply").addEventListener("click", loadSymbol);
    document.getElementById("ticker").addEventListener("keydown", (e) => {
      if (e.key === "Enter") loadSymbol();
    });
    document.getElementById("interval").addEventListener("change", loadSymbol);

    poll();
    setInterval(poll, 5000);
    window.addEventListener("resize", () => chart.resize());
  </script>
</body>
</html>
