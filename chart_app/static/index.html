<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>chart-app</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/vendor/echarts.min.js"></script>
</head>
<body>
  <div id="meta">
    <input id="ticker" type="text" maxlength="14" value="SPY" spellcheck="false"
           list="symbols" title="Equity (SPY, NVDA) or crypto perp (BTC-PERP, ETH-PERP)">
    <datalist id="symbols">
      <option value="SPY"><option value="QQQ"><option value="IWM">
      <option value="NVDA"><option value="AMD"><option value="TSLA">
      <option value="BTC-PERP"><option value="ETH-PERP"><option value="SOL-PERP">
      <option value="XRP-PERP"><option value="DOGE-PERP"><option value="BTC-USD">
    </datalist>
    <select id="interval">
      <option>3m</option><option>5m</option><option>10m</option>
      <option selected>15m</option><option>30m</option><option>1h</option>
      <option>4h</option><option>1d</option>
    </select>
    <button id="apply" type="button">Load</button>

    <div id="modes" title="1 / 2 / 3">
      <button type="button" data-mode="clean" title="Candles and volume only — no algo">Clean</button>
      <button type="button" data-mode="signals" title="One conviction line plus buy/sell marks">Signals</button>
      <button type="button" data-mode="full" title="Every overlay">Full</button>
    </div>
    <button id="testerToggle" type="button"
            title="Live strategy tester: move a knob, re-score the loaded bars (key: t)">Test</button>

    <strong id="label">—</strong>
    <span id="stamp"></span>

    <div id="algo" title="Conviction, -100 to +100">
      <span id="algoScore">+0</span>
      <span id="algoBar"><i></i></span>
      <span id="algoAction">FLAT</span>
    </div>

    <div id="legs">
      <span data-leg="wave3" title="Elliott wave 3">W3</span>
      <span data-leg="squeeze" title="Bollinger bandwidth in its bottom percentile">SQ</span>
      <span data-leg="trend" title="ADX + MA alignment">TR</span>
      <span data-leg="whale" title="Whale option premium on this bar">WH</span>
      <span data-leg="liquidity" title="Hui-Heubel liquidity (ELMo)">LQ</span>
    </div>
  </div>

  <div id="overlays" class="hidden">
    <label><input type="checkbox" data-overlay="ema20" checked>ema20</label>
    <label><input type="checkbox" data-overlay="ema50" checked>ema50</label>
    <label><input type="checkbox" data-overlay="ema200">ema200</label>
    <label><input type="checkbox" data-overlay="vwap" checked>vwap</label>
    <label><input type="checkbox" data-overlay="alma">alma</label>
    <span class="sep"></span>
    <label><input type="checkbox" data-overlay="bb" checked>bb</label>
    <label><input type="checkbox" data-overlay="vwapb">vwap&#177;&#963;</label>
    <label><input type="checkbox" data-overlay="atr">atr ch</label>
    <label><input type="checkbox" data-overlay="pdhl">pd h/l</label>
    <span class="sep"></span>
    <label><input type="checkbox" data-overlay="algo" checked>conviction</label>
    <label><input type="checkbox" data-overlay="stop" checked>stop</label>
    <label><input type="checkbox" data-overlay="whale" checked>whale</label>
    <span class="sep"></span>
    <label><input type="checkbox" data-overlay="volume" checked>volume</label>
    <label><input type="checkbox" data-overlay="flow" checked>flow</label>
    <label><input type="checkbox" data-overlay="elmo">elmo</label>
    <label><input type="checkbox" data-overlay="rsi">rsi</label>
    <label><input type="checkbox" data-overlay="cci">cci</label>
    <label><input type="checkbox" data-overlay="macd">macd</label>
  </div>

  <div id="tester"></div>

  <div id="chart"></div>

  <script src="/static/js/theme.js"></script>
  <script src="/static/js/render.js"></script>
  <script src="/static/js/tester.js"></script>
  <script src="/static/js/gears.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
