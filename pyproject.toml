[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "financial-development"
version = "1.0.0"
description = "Quantitative finance development suite — options, vol, sentiment, VaR, swaps ingestion"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
# requirements.txt is the single source of truth for runtime dependencies
# (exact pins reflecting what's actually installed and working); not
# duplicated here to avoid the two files drifting apart.
dependencies = { file = ["requirements.txt"] }

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=13"]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-xdist>=3", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["shared*"]

[tool.pytest.ini_options]
# "tests" is the root-level suite: cross-suite concerns that belong to no single
# child (orchestrator wiring, shared/ modules) rather than to Vol_Suite et al.
testpaths = ["tests", "shared/tests", "Vol_Suite/tests", "Options_Suite/tests", "VaR_Tools_Simulations/tests", "sentiment-scanner/tests", "Tools/tests", "Direction/tests", "chart_app/tests"]
pythonpath = ["."]
markers = [
    "unit: tests that require no network or credentials",
]
