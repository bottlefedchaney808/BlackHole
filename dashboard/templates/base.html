<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}BlackHole Investments Dashboard{% endblock %}</title>
<style>
/* Everything inline -- this runs offline on localhost, no CDN anything.
   Palette matches shared/chart_theme.py's dark navy-to-blue theme (no
   purple/violet anywhere); keep the two in sync by hand if either changes. */
:root {
  --bg: #070a14;
  --panel: #0c1122;
  --panel-2: #121a30;
  --border: #24304f;
  --text: #f8fafc;
  --muted: #94a3b8;
  --accent: #3b82f6;
  --accent-2: #38bdf8;
  --accent-soft: #3b82f622;
  --accent-glow: #3b82f699;
  --ok: #34d399;
  --ok-soft: #34d39922;
  --warn: #fbbf24;
  --warn-soft: #fbbf2422;
  --err: #f87171;
  --err-soft: #f8717122;
  --file-json: #38bdf8;
  --file-csv: #a3e635;
  --file-png: #22d3ee;
  --file-pdf: #f472b6;
  --file-other: #94a3b8;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a {
  color: var(--accent); text-decoration: none;
  border-bottom: 1px solid transparent; padding-bottom: 1px;
  transition: border-image .15s ease;
}
a:hover {
  border-bottom: 1px solid;
  border-image: linear-gradient(90deg, var(--accent-2), var(--accent)) 1;
}
code, pre, .mono { font-family: var(--mono); }

header.topbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
}
.brand { font-weight: 650; letter-spacing: -0.01em; padding: 14px 0; white-space: nowrap; }
.brand span { color: var(--muted); font-weight: 400; }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
nav.tabs a {
  padding: 14px 12px; color: var(--muted); font-weight: 500;
  border-bottom: 2px solid transparent; text-decoration: none;
}
nav.tabs a:hover { color: var(--text); }
nav.tabs a.on { color: var(--text); border-bottom-color: var(--accent); text-shadow: 0 0 12px var(--accent-glow); }

main { max-width: 1500px; margin: 0 auto; padding: 22px 20px 64px; }
/* Full-bleed opt-out: pages that own the whole viewport (Chart) fill the
   body_class block with "page-chart" and escape the centered 1500px column,
   which otherwise leaves black gutters on a wide monitor. */
body.page-chart main { max-width: none; padding: 12px 16px; }
h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.02em; }
h2 { font-size: 15px; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 18px;
  overflow: hidden;
  box-shadow: 0 1px 2px rgba(0,0,0,.16), 0 12px 28px -16px rgba(0,0,0,.4);
  transition: box-shadow .15s ease;
}
.panel > header {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  background: var(--panel-2); flex-wrap: wrap;
}
.panel > header .note { color: var(--muted); font-size: 12px; }
.panel .body { padding: 14px 16px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 18px; }

/* Shared widget-grid: Overview's customizable widgets, and later the empty
   side space on the Chart tab -- one grid class both pages can drop cards
   into rather than each inventing its own layout. */
.widget-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 18px; }
.widget-grid .widget { margin-bottom: 0; }

/* Terminal-distribution histograms -- shared between quant.html (module sims)
   and index.html (widget 3's per-position sims). Small inline-SVG bars, no
   chart library. */
.dist-chart { margin: 10px 0 0; }
.dist-chart-title { color: var(--muted); margin-bottom: 2px; }
.dist-chart svg { display: block; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; }
.dist-bar { fill: var(--accent); }
.dist-percentiles { margin-top: 3px; color: var(--muted); }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px;
}
.card .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.card .v { font-size: 22px; font-weight: 620; margin-top: 6px; letter-spacing: -0.02em; word-break: break-word; }
.card .x { color: var(--muted); font-size: 12px; margin-top: 2px; }

.tablewrap { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th {
  position: sticky; top: 0; background: var(--panel-2);
  color: var(--muted); font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .05em;
}
tbody tr:hover { background: var(--panel-2); }
tbody tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; font-family: var(--mono); font-size: 12.5px; }
td.wrap { white-space: normal; max-width: 460px; }
.scrollbox { max-height: 560px; overflow: auto; }

.pill {
  display: inline-block; padding: 2px 8px; border-radius: 999px;
  font-size: 11px; font-weight: 600; letter-spacing: .02em;
  border: 1px solid transparent; white-space: nowrap;
}
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.partial, .pill.running, .pill.queued { background: var(--warn-soft); color: var(--warn); }
.pill.error, .pill.timeout, .pill.failed { background: var(--err-soft); color: var(--err); }
.pill.plain { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px -2px var(--accent-glow); }

.empty {
  padding: 26px 16px; text-align: center; color: var(--muted);
  border: 1px dashed var(--border); border-radius: 8px; margin: 4px 0;
}
.errbox {
  padding: 10px 12px; border-radius: 8px; margin: 0 0 12px;
  background: var(--err-soft); color: var(--err);
  border: 1px solid var(--border); font-family: var(--mono); font-size: 12px;
  word-break: break-word;
}

form.runform { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
input, select, button {
  font: inherit; color: var(--text); background: var(--panel-2);
  border: 1px solid var(--border); border-radius: 7px; padding: 7px 10px;
}
input:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
button {
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  border-color: transparent; color: #fff;
  font-weight: 700; cursor: pointer;
  box-shadow: 0 0 16px -2px var(--accent-glow), 0 2px 12px -4px var(--accent);
  transition: filter .15s ease, transform .1s ease, box-shadow .15s ease;
}
button.ghost { background: var(--panel-2); color: var(--text); border-color: var(--border); box-shadow: none; }
button:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 0 24px -2px var(--accent-glow), 0 2px 16px -4px var(--accent); }
button:disabled { opacity: .55; cursor: not-allowed; filter: none; transform: none; }

pre.json {
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px; overflow: auto; max-height: 420px; font-size: 12px; margin: 0;
}
.kv { display: grid; grid-template-columns: minmax(120px, 210px) 1fr; gap: 0; font-size: 13px; }
.kv > div { padding: 7px 10px; border-bottom: 1px solid var(--border); }
.kv > div:nth-child(odd) { color: var(--muted); }
.kv > div.val { font-family: var(--mono); font-size: 12.5px; word-break: break-word; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.pager { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px 16px; }

/* Suite tabs on the Output page (dashboard/templates/suite.html) -- gradient
   pill for the active suite, muted flat pill for the rest. */
.pill.suitepill {
  background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
  padding: 5px 14px; font-weight: 700; margin-right: 8px;
}
.pill.suitepill.on {
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  color: #fff; border-color: transparent;
  box-shadow: 0 0 18px -2px var(--accent-glow), 0 2px 12px -2px var(--accent);
}

/* One card per output file, accented by file kind (dashboard/templates/suite.html) */
.filecard.json > header { border-left: 3px solid var(--file-json); }
.filecard.csv > header { border-left: 3px solid var(--file-csv); }
.filecard.png > header { border-left: 3px solid var(--file-png); }
.filecard.pdf > header { border-left: 3px solid var(--file-pdf); }
.filecard.other > header { border-left: 3px solid var(--file-other); }

/* Live-run banner (dashboard/templates/suite.html) */
.banner-live { border-color: var(--accent); box-shadow: 0 0 20px -4px var(--accent-glow); }
.banner-live .body { display: flex; align-items: center; gap: 10px; }

/* Share (quick-tunnel) control -- dashboard/templates/base.html */
.share { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.share .label { color: var(--muted); font-size: 12px; }
.share .status { color: var(--ok); font-size: 12px; font-weight: 600; }
.share .status.idle { color: var(--muted); }
.share .status.error { color: var(--err); }
.share a.shareurl { font-family: var(--mono); font-size: 12px; word-break: break-all; max-width: 320px; }
</style>
</head>
<body class="{% block body_class %}{% endblock %}">
<header class="topbar">
  <div class="brand">BlackHole Investments <span>/ live dashboard</span></div>
  <nav class="tabs">
    <a href="/" class="{{ 'on' if active == 'home' else '' }}">Overview</a>
    <a href="/quant" class="{{ 'on' if active == 'quant' else '' }}">Quant Console</a>
    <a href="/chart" class="{{ 'on' if active == 'chart' else '' }}">Chart</a>
    <a href="/dealer-book" class="{{ 'on' if active == 'dealer-book' else '' }}">Dealer Book</a>
    <a href="/suites/options" class="{{ 'on' if active == 'suites' else '' }}">Suite output</a>
  </nav>
  <div class="share" id="shareControl">
    <span class="label">Share:</span>
    <span class="status idle" id="shareStatus">Not sharing</span>
    <a class="shareurl" id="shareUrl" href="#" target="_blank" rel="noopener" style="display:none"></a>
    <button type="button" id="shareBtn" class="ghost">Start sharing</button>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
<script>
(function () {
  var control = document.getElementById('shareControl');
  if (!control) return;
  var statusEl = document.getElementById('shareStatus');
  var urlEl = document.getElementById('shareUrl');
  var btn = document.getElementById('shareBtn');

  function render(s) {
    if (s.state === 'running') {
      statusEl.textContent = 'Sharing';
      statusEl.className = 'status';
      urlEl.textContent = s.url;
      urlEl.href = s.url;
      urlEl.style.display = '';
      btn.textContent = 'Stop sharing';
      btn.disabled = false;
    } else if (s.state === 'connecting') {
      statusEl.textContent = 'Connecting…';
      statusEl.className = 'status';
      urlEl.style.display = 'none';
      btn.textContent = 'Starting…';
      btn.disabled = true;
    } else {
      statusEl.textContent = s.last_error ? 'Error' : 'Not sharing';
      statusEl.className = 'status ' + (s.last_error ? 'error' : 'idle');
      urlEl.style.display = 'none';
      btn.textContent = 'Start sharing';
      btn.disabled = false;
      if (s.last_error) console.warn('share:', s.last_error);
    }
  }

  function poll() {
    fetch('/share/status')
      .then(function (r) { return r.json(); })
      .then(render)
      .catch(function (e) { console.error('share poll failed', e); });
  }

  btn.addEventListener('click', function () {
    if (btn.textContent === 'Start sharing') {
      var ok = window.confirm(
        'This exposes your dashboard publicly with NO password. ' +
        'Only share the link with people you trust. Continue?'
      );
      if (!ok) return;
      btn.disabled = true;
      btn.textContent = 'Starting…';
      fetch('/share/start', { method: 'POST' })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
        .then(function (res) {
          if (!res.ok) {
            statusEl.textContent = 'Error';
            statusEl.className = 'status error';
            btn.textContent = 'Start sharing';
            btn.disabled = false;
            console.error('share start failed:', res.body);
            return;
          }
          render(res.body);
        })
        .catch(function (e) { console.error('share start error', e); });
    } else if (btn.textContent === 'Stop sharing') {
      fetch('/share/stop', { method: 'POST' })
        .then(function (r) { return r.json(); })
        .then(render)
        .catch(function (e) { console.error('share stop error', e); });
    }
  });

  poll();
  setInterval(poll, 4000);
})();
</script>
</body>
</html>
