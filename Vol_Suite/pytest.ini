[pytest]
# Put the project root on sys.path for every test run.
#
# Why this is needed: with pytest's default "prepend" import mode, the path it
# inserts is the test FILE's own directory (tests/), not the project root -- so
# `import backtest_stage3` inside tests/ has no way to resolve. Modules under
# tests/ are not a package and the suite's modules are all flat at the root.
#
# This previously "worked" by accident. tests/test_suite_context.py did a
# sys.path.insert at import time, so every test module collected AFTER it
# alphabetically inherited the patched path and imported fine, while the three
# sorting before it (backtest_stage3, dealer_positioning_sign_model,
# replication_reference_accumulation) failed at collection. Importability
# depending on filename alphabetical order is not a thing to leave in place --
# hence declaring it here instead, once, for the whole suite.
pythonpath = .

testpaths = tests

# Registering these silences the PytestUnknownMarkWarning noise (22 of them per
# run) and, more usefully, means a typo'd mark name now fails loudly instead of
# quietly marking nothing.
markers =
    unit: fast, fully network-free test against synthetic data
    integration: touches the live ThetaData proxy -- needs .env credentials

# Show the reason for skips/xfails rather than a bare 's', so a silently
# skipped test can't hide in the summary line.
addopts = -ra
